<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIALIFE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E">

<style>
:root{--bg:#f2f7fc;--card:#fff;--text:#0e2238;--muted:#5b6f85;--blue:#0a5fd6;--red:#c4121f;--green:#1f7a3a;--line:#d9e4f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1626;--card:#122339;--text:#e8f0fa;--muted:#9bb0c7;--line:#223a56}}
:root[data-theme="dark"]{--bg:#0a1626;--card:#122339;--text:#e8f0fa;--muted:#9bb0c7;--line:#223a56}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5;padding-bottom:84px}
.hero{background:radial-gradient(circle at 85% 20%,#4fa3ff55 0,transparent 45%),linear-gradient(160deg,#06357a,#0a5fd6 70%,#2b8cff);color:#fff;padding:56px 20px 32px;text-align:center}
.hero h1{margin:0;font-size:clamp(40px,10vw,68px);font-weight:900;letter-spacing:.04em}
.hero p{margin:10px auto 0;max-width:34ch;font-size:18px;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chips span{background:#ffffff22;border:1px solid #ffffff44;padding:6px 14px;border-radius:99px;font-size:14px}
main{max-width:980px;margin:20px auto 0;padding:0 14px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--muted)}
.note b{color:var(--text)}
.tabs{display:flex;gap:8px;margin:18px 0 6px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 18px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs button:focus-visible,.btn:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
h2{margin:26px 4px 12px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:520/650;position:relative;background:#cfe4fa}.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.w{background:radial-gradient(circle at 30% 25%,#fff8 0,transparent 40%),linear-gradient(180deg,#bfe0ff,#5aa8f5)}
.pic.m{background:radial-gradient(circle at 70% 20%,#ffd0d055 0,transparent 45%),linear-gradient(180deg,#ffc9c9,#e0525c)}
.pic.t{background:radial-gradient(circle at 25% 20%,#fff9c455 0,transparent 45%),linear-gradient(180deg,#d6f2c8,#6cbf5a)}

.vol{position:absolute;top:10px;left:10px;background:#fff;color:#0e2238;font-weight:800;font-size:14px;padding:3px 11px;border-radius:99px}
.info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:17px}
.price{font-size:15px;color:var(--muted)}
.price b{font-size:19px;color:var(--text)}
.btn{margin-top:auto;display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;font-weight:800;padding:11px;border-radius:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:5}
.bar div{font-size:14px;color:var(--muted);line-height:1.3}
.bar b{display:block;font-size:17px;color:var(--text)}
.bar a{background:var(--green);color:#fff;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:12px;white-space:nowrap}
footer{text-align:center;color:var(--muted);font-size:13px;margin:30px 0 10px}
.dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.dlg.on{display:flex}.dlg>div{background:var(--card);color:var(--text);border-radius:20px;padding:24px;max-width:340px;width:100%;text-align:center}.dlg h3{margin:0 0 4px;font-size:18px}.dlg .num{font-size:28px;font-weight:900;margin:10px 0 16px;color:var(--blue);letter-spacing:.02em}.dlg a,.dlg button{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;margin-top:8px}.dlg a{background:var(--green);color:#fff}.dlg .cp{background:var(--blue);color:#fff}.dlg .x{background:var(--line);color:var(--text)}

.lang{position:absolute;top:12px;right:12px;display:flex;background:#ffffff26;border:1px solid #ffffff55;border-radius:99px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:#fff;font:inherit;font-weight:800;font-size:14px;padding:6px 12px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#06357a}
.hero{position:relative}
.dlg input{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit}
.dlg label{display:block;text-align:left;font-size:13px;color:var(--muted);margin-top:10px}
.dlg .sub{font-size:14px;color:var(--muted);margin:0 0 6px}
.dlg .err{color:#d43b3b;font-size:14px;min-height:18px;margin-top:6px}
.dlg .msg{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;text-align:left;margin:4px 0 4px}
.dlg .lk{background:transparent;color:var(--muted);font-weight:600;text-decoration:underline;margin-top:4px}
.dlg>div{max-height:92vh;overflow:auto}
.warn{background:#fff4d6;border:1px solid #f2c14e;border-left:6px solid #f2a900;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:16px;color:#4a3500}
.show{display:block;width:100%;max-width:560px;height:auto;border-radius:18px;margin:14px auto 0;border:1px solid var(--line)}
</style>
</head>
